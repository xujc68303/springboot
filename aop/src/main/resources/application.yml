server:
  port: 8080

  tomcat:
    uri-encoding: utf-8

  servlet:
    session:
      timeout: 30m

spring:

  application:
    name: aop

  profiles:
    active: dev

  datasource:
    name: ds
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://localhost:3306/develop?useUnicode=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowMultiQueries=true
      username: root
      password: root
      initial-size: 1
      max-active: 30
      min-idle: 1
      max-wait: 30000

